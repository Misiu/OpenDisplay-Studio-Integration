api: 1
id: hello-world
name: Hello world
version: 1.0.0
description: Greets someone. The smallest useful widget package.
icon: mdi:hand-wave
category: Examples
author: OpenDisplay Studio

layout:
  defaultSize: { width: 240, height: 100 }
  minSize: { width: 120, height: 50 }

options:
  - section: content
    fields:
      - key: who
        label: Who to greet
        default: world
        selector: { text: {} }
  - section: appearance
    fields:
      - key: showFrame
        label: Show frame
        default: true
        selector: { boolean: {} }
      - key: invert
        label: Invert colors
        default: false
        selector: { boolean: {} }
