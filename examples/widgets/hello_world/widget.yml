api: 1
id: hello-world
name: Hello world
version: 1.0.0
description: Greets someone. The smallest useful widget package.
icon: mdi:hand-wave
category: Examples
author: OpenDisplay Studio

layout:
  defaultSize: { width: 240, height: 100 }
  minSize: { width: 120, height: 50 }

options:
  - section: content
    fields:
      - key: who
        label: Who to greet
        default: world
        selector: { text: {} }
  - section: appearance
    fields:
      - key: showFrame
        label: Show frame
        default: true
        selector: { boolean: {} }
      - key: cornerRadius
        label: Corner radius
        default: 6
        selector: { number: { min: 0, max: 24, mode: box } }
      - key: color
        label: Color
        default: black
        selector: { opendisplay_color: {} }
      - key: background
        label: Background
        default: white
        selector: { opendisplay_color: {} }
