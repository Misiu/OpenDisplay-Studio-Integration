api: 1
id: sensor-card
name: Sensor card
version: 2.0.0
description: The value of one entity as a tile that follows the shape of its frame.
icon: mdi:gauge
category: Sensors
author: OpenDisplay Studio

layout:
  defaultSize: { width: 280, height: 160 }
  minSize: { width: 120, height: 80 }

sources:
  - key: entities
    label: Entity
    selector:
      entity: {}
    required: true
    max: 1
    data: entity_state
    perSource:
      - key: label
        label: Label
        selector: { text: {} }
      - key: icon
        label: Icon
        selector: { text: {} }

options:
  - section: content
    fields:
      - key: showIcon
        label: Show icon
        default: true
        selector: { boolean: {} }
      - key: showName
        label: Show name
        default: true
        selector: { boolean: {} }
      - key: showUnit
        label: Show unit
        default: true
        selector: { boolean: {} }
      - key: decimals
        label: Decimals
        default: auto
        selector:
          select:
            options: [auto, "0", "1", "2", "3"]
      - key: showSeparator
        label: Show separator
        default: true
        selector: { boolean: {} }
      - key: align
        label: Alignment
        default: auto
        selector:
          select:
            options: [auto, left, center, right]
      - key: valueSize
        label: Value size
        default: auto
        selector:
          select:
            options: [auto, small, medium, large]
  - section: thresholds
    fields:
      - key: alertBelow
        label: Alert below
        default: ""
        selector: { text: {} }
      - key: alertAbove
        label: Alert above
        default: ""
        selector: { text: {} }
      - key: alertColor
        label: Alert color
        default: accent
        selector: { opendisplay_color: {} }
  - section: appearance
    fields:
      - key: showFrame
        label: Show frame
        default: true
        selector: { boolean: {} }
      - key: cornerRadius
        label: Corner radius
        default: 6
        selector: { number: { min: 0, max: 24, mode: box } }
      - key: color
        label: Color
        default: black
        selector: { opendisplay_color: {} }
      - key: background
        label: Background
        default: white
        selector: { opendisplay_color: {} }
