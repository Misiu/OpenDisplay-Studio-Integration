# Sizes and palette the preview tool draws every state at.
palette: spectra6
sizes:
  - {name: small, width: 120, height: 120}
  - {name: square, width: 200, height: 200}
  - {name: wide, width: 296, height: 128}
  - {name: tall, width: 160, height: 280}
  - {name: quadrant, width: 400, height: 240}
  - {name: full, width: 480, height: 480}
docs:
