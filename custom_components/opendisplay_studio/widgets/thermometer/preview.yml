  - {title: "A processor, green, yellow from 60 and red from 85", state: processor, size: square}
  - {title: "Degrees Fahrenheit", state: fahrenheit, size: square}
  - {title: "Without the numbers of the scale", state: outdoor, size: square, options: {showLabels: false}}
  - {title: "A small frame keeps the dial and the value", state: outdoor, size: small}
  - {title: "On a wide tag, in Polish", state: polish, size: wide}
  - {title: "White on black, without the frame", state: outdoor, size: square, options: {color: white, background: black, needleColor: white}}
