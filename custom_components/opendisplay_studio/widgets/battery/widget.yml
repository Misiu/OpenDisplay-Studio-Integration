api: 1
id: battery
name: Battery
version: 1.0.0
description: The charge of a battery as a battery that fills up, with its percentage.
icon: mdi:battery-70
category: Sensors
author: OpenDisplay Studio

layout:
  defaultSize: { width: 200, height: 100 }
  minSize: { width: 24, height: 24 }

sources:
  - key: entities
    label: Entity
    selector:
      entity: { filter: { domain: [sensor, binary_sensor] } }
    required: true
    max: 1
    data: entity_state
    perSource:
      - key: label
        label: Label
        selector: { text: {} }

options:
  - section: content
    fields:
      - key: showName
        label: Show name
        default: true
        selector: { boolean: {} }
      - key: showPercentage
        label: Show percentage
        default: true
        selector: { boolean: {} }
      - key: style
        label: Style
        default: solid
        selector:
          select:
            options: [solid, segments]
      - key: percentagePlacement
        label: Percentage
        default: beside
        selector:
          select:
            options: [beside, inside]
      - key: orientation
        label: Orientation
        default: auto
        selector:
          select:
            options: [auto, horizontal, vertical]
  - section: thresholds
    fields:
      - key: lowLevel
        label: Low battery at or below
        default: 20
        selector: { number: { min: 0, max: 100, mode: slider } }
      - key: alertColor
        label: Low battery color
        default: accent
        selector: { opendisplay_color: {} }
  - section: appearance
    fields:
      - key: showFrame
        label: Show frame
        default: true
        selector: { boolean: {} }
      - key: cornerRadius
        label: Corner radius
        default: 6
        selector: { number: { min: 0, max: 24, mode: box } }
      - key: color
        label: Color
        default: black
        selector: { opendisplay_color: {} }
      - key: background
        label: Background
        default: white
        selector: { opendisplay_color: {} }
