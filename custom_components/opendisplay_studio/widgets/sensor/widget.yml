id: sensor
name: Sensor
version: "0.6.1"
description: Current value of a selected Home Assistant sensor.
icon: mdi:gauge
framework: 3.2.0
template: widget.liquid
provider: provider.py

defaults:
  entity: ""
  showEntityId: true
  showFooter: true

fields:
  - key: entity
    label: Sensor entity
    required: true
    selector:
      entity:
        filter:
          domain: sensor
  - key: showEntityId
    label: Show entity ID
    selector:
      boolean: {}
  - key: showFooter
    label: Show footer
    selector:
      boolean: {}

dataRequirements:
  - key: sensor
    provider: sensor
    configKey: entity
    cardinality: one
    optional: false
