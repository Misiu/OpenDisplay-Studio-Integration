# Sizes and palette the preview tool draws every state at.
palette: bw
sizes:
  - {name: full, width: 800, height: 480}
  - {name: half horizontal, width: 800, height: 240}
  - {name: half vertical, width: 400, height: 480}
  - {name: quadrant, width: 400, height: 240}
  - {name: small, width: 296, height: 128}
docs:
  - {title: "A list where one value is past its threshold", state: alert-list, size: quadrant}
  - {title: "White on black", state: alert-list, size: quadrant, options: {color: white, background: black}}
  - {title: "Without frame and dividers", state: alert-list, size: quadrant, options: {showFrame: false, showDividers: false}}
  - {title: "Names only in Polish", state: polish-list, size: half vertical, options: {showIcon: false}}
  - {title: "Nothing chosen yet", state: missing-sources, size: small}
