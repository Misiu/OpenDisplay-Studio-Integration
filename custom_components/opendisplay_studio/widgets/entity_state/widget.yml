id: entity-state
name: Entity State
version: "0.5.0"
description: Current state of a selected Home Assistant entity.
icon: mdi:gauge
framework: 3.2.0
template: widget.liquid
provider: provider.py

defaults:
  entity: ""
  title: ""
  layout: large
  showIcon: true
  showName: true
  showUnit: true

fields:
  - key: entity
    label: Entity
    type: entity
    required: true
  - key: title
    label: Title
    type: text
  - key: layout
    label: Layout
    type: select
    options:
      - label: Large value
        value: large
      - label: Compact
        value: compact
  - key: showIcon
    label: Show icon
    type: toggle
  - key: showName
    label: Show name
    type: toggle
  - key: showUnit
    label: Show unit
    type: toggle

dataRequirements:
  - key: entity
    provider: entity_state
    configKey: entity
    cardinality: one
    optional: false
