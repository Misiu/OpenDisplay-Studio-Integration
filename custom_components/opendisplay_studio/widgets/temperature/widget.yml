id: temperature
name: Temperature
version: "1.0.0"
description: Current value of a Home Assistant temperature entity.
icon: mdi:thermometer
renderer: renderer.py
provider: provider.py

layout:
  defaultSize:
    width: 280
    height: 160
  minSize:
    width: 120
    height: 80

defaults:
  entity: ""
  title: ""
  showIcon: true
  showName: true
  showUnit: true
  accent: black

fields:
  - key: entity
    label: Temperature entity
    required: true
    selector:
      entity:
        filter:
          domain: sensor
          device_class: temperature
  - key: title
    label: Title
    selector:
      text: {}
  - key: showIcon
    label: Show icon
    selector:
      boolean: {}
  - key: showName
    label: Show name
    selector:
      boolean: {}
  - key: showUnit
    label: Show unit
    selector:
      boolean: {}
  - key: accent
    label: Accent color
    selector:
      select:
        options:
          - black
          - accent

dataRequirements:
  - key: entity
    provider: entity-state
    configKey: entity
    cardinality: one
    optional: false
