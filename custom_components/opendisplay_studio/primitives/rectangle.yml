type: rectangle
order: 20
name: Rectangle
description: Filled or outlined rectangle
icon: mdi:rectangle-outline
category: shapes
geometry: box
extent:
  x: 160
  y: 90
fields:
  - key: x_start
    label: Left
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y_start
    label: Top
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: x_end
    label: Right
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y_end
    label: Bottom
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: fill
    label: Fill
    shape: color
    nullable: true
    section: appearance
  - key: outline
    label: Outline
    shape: color
    default: black
    section: appearance
  - key: width
    label: "Outline width"
    shape: number
    min: 0
    max: 32
    default: 2
    unit: px
    section: appearance
  - key: radius
    label: "Corner radius"
    shape: number
    min: 0
    max: 256
    optional: true
    unit: px
    section: appearance
  - key: corners
    label: "Rounded corners"
    shape: flags
    options: [top_left, top_right, bottom_right, bottom_left]
    optional: true
    section: appearance
