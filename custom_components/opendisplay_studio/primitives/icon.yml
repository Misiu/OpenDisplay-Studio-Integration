type: icon
order: 60
name: Icon
description: Material Design icon from the bundled ODL font
icon: mdi:star-outline
category: media
geometry: point
fields:
  - key: value
    label: MDI icon name
    shape: string
    required: true
    maxLength: 128
    default: star-outline
    section: appearance
  - key: x
    label: X
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y
    label: Y
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: size
    label: Size
    shape: number
    min: 8
    max: 256
    default: 48
    unit: px
    section: layout
  - key: color
    label: Color
    shape: color
    default: black
    section: appearance
  - key: anchor
    label: Anchor
    shape: enum
    options:
      - lt
    default: lt
    visible: false
    section: appearance
