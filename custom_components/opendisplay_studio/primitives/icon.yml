type: icon
order: 60
name: Icon
description: Material Design icon from the bundled ODL font
icon: mdi:star-outline
category: media
geometry: point
fields:
  - key: value
    label: "MDI icon name"
    shape: string
    required: true
    maxLength: 128
    default: star-outline
    section: appearance
  - key: x
    label: X
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y
    label: Y
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: size
    label: Size
    shape: number
    min: 8
    max: 256
    default: 48
    unit: px
    section: layout
  - key: fill
    label: Color
    shape: color
    default: black
    section: appearance
  - key: anchor
    label: Anchor
    shape: enum
    options: [la, ma, ra, lt, mt, rt, lm, mm, rm, ls, ms, rs, lb, mb, rb, ld, md, rd]
    default: la
    section: layout
  - key: stroke_width
    label: "Stroke width"
    shape: number
    min: 0
    max: 16
    default: 0
    unit: px
    section: appearance
  - key: stroke_fill
    label: "Stroke color"
    shape: color
    default: white
    section: appearance
