type: multiline
order: 11
name: Multiline text
description: Text split into lines at a delimiter
icon: mdi:format-line-spacing
category: text
geometry: point
fields:
  - key: value
    label: Text
    shape: text
    required: true
    default: "First line|Second line|Third line"
    section: appearance
  - key: delimiter
    label: Delimiter
    shape: string
    maxLength: 8
    default: "|"
    section: appearance
  - key: x
    label: X
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y
    label: Y
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: offset_y
    label: "Line height"
    shape: number
    min: 1
    max: 512
    default: 42
    unit: px
    section: layout
  - key: size
    label: Size
    shape: number
    min: 6
    max: 256
    default: 32
    unit: px
    section: layout
  - key: color
    label: Color
    shape: color
    default: black
    section: appearance
  - key: anchor
    label: Anchor
    shape: enum
    options: [lt, mt, rt, lm, mm, rm, lb, mb, rb]
    default: lm
    section: layout
  - key: font
    label: Font
    shape: font
    default: ppb.ttf
    options: [ppb.ttf, rbm.ttf]
    section: appearance
  - key: align
    label: Alignment
    shape: enum
    options: [left, center, right]
    default: left
    section: appearance
  - key: spacing
    label: "Line spacing"
    shape: number
    min: 0
    max: 100
    default: 5
    unit: px
    section: appearance
  - key: stroke_width
    label: "Stroke width"
    shape: number
    min: 0
    max: 16
    default: 0
    unit: px
    section: appearance
  - key: stroke_fill
    label: "Stroke color"
    shape: color
    default: white
    section: appearance
  - key: parse_colors
    label: "Color markup"
    shape: boolean
    default: false
    section: appearance
