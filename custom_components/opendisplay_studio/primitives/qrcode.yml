type: qrcode
order: 70
name: QR code
description: Locally generated QR code
icon: mdi:qrcode
category: media
geometry: point
fields:
  - key: data
    label: Content
    shape: text
    required: true
    # The most a QR code can hold at the error correction the renderer uses.
    maxBytes: 1273
    default: ODX
    section: appearance
  - key: x
    label: X
    shape: coordinate
    axis: x
    required: true
    section: layout
  - key: y
    label: Y
    shape: coordinate
    axis: y
    required: true
    section: layout
  - key: boxsize
    label: Module size
    shape: number
    min: 1
    max: 16
    default: 3
    unit: px
    section: layout
  - key: border
    label: Quiet zone
    shape: number
    min: 0
    max: 8
    default: 1
    unit: modules
    section: appearance
  - key: color
    label: Foreground
    shape: color
    default: black
    section: appearance
  - key: bgcolor
    label: Background
    shape: color
    default: white
    section: appearance
